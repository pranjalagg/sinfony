[project]
name = "sinfony"
version = "0.1.0"
description = "Music from mathematics: functions, noise, and music theory composed in layers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "mido>=1.3"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinfony"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
